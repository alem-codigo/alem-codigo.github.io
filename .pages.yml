# Configuração do Pages CMS (D-12). Referência: https://pagescms.org/docs/configuration/
#
# Os campos espelham os schemas de src/content.config.ts. O painel valida o básico (obrigatórios,
# formatos); a validação final continua sendo o build (ordem das datas, referências, imagens).
#
# Pontos de compatibilidade com o Astro (validados em 2026-10-25, ver SPEC seção 4):
# - Imagens: `output` relativo (../../assets/images/...) porque o `image()` resolve o caminho a partir
#   do arquivo de conteúdo. Todas as coleções ficam em src/content/<colecao>/, a dois níveis de src/.
# - Referências: o painel grava o nome do arquivo (`fulano.yaml`); o schema remove a extensão
#   (`idDeReferencia` em src/lib/schemas.ts). Renomear mentor, eixo ou selo não atualiza as mentorias:
#   se já estiver em uso, o build falha com "Conteúdo inconsistente" até a seleção ser refeita.
# - Datas: gravadas como AAAA-MM-DD sem aspas; o schema normaliza o Date do YAML (seção 6.2).
#   `default: ""` evita que uma data nova venha preenchida com o dia de hoje.

media:
  - name: mentores
    label: Fotos de mentores
    input: src/assets/images/mentores
    output: ../../assets/images/mentores
    extensions: [jpg, jpeg, png, webp, avif]
    rename: safe
  - name: mentorias
    label: Capas de mentorias
    input: src/assets/images/mentorias
    output: ../../assets/images/mentorias
    extensions: [jpg, jpeg, png, webp, avif]
    rename: safe
  - name: parceiros
    label: Logos de parceiros
    input: src/assets/images/parceiros
    output: ../../assets/images/parceiros
    extensions: [svg, png, jpg, jpeg, webp, avif]
    rename: safe
  - name: eixos
    label: Imagens dos eixos
    input: src/assets/images/eixos
    output: ../../assets/images/eixos
    extensions: [jpg, jpeg, png, webp, avif]
    rename: safe

content:
  - name: mentorias
    label: Mentorias
    description: 'O status (em breve, inscrições abertas etc.) é calculado pelas datas; não há campo de status.'
    type: collection
    path: src/content/mentorias
    format: yaml-frontmatter
    # M26-01 → m26-01.md (o painel gera o nome em minúsculas; o endereço vem do código).
    filename: "{codigo}.md"
    view:
      primary: titulo
      fields: [titulo, codigo]
      sort: [codigo, titulo]
      search: [titulo, codigo]
      default:
        sort: codigo
        order: desc
    fields:
      - name: codigo
        label: Código
        type: string
        required: true
        description: "Formato M<ano>-<sequência>, ex.: M26-01. O ano é o do início da realização (2 dígitos); a sequência começa em 01 e reinicia a cada ano (veja o maior código do ano na lista). Define o endereço da página (/mentorias/m26-01) e o nome do arquivo; não altere depois de divulgar."
        pattern:
          regex: '^M\d{2}-(?!00)\d{2}$'
          message: "Use o formato M26-01: M maiúsculo, ano com 2 dígitos, traço e sequência com 2 dígitos (a partir de 01)."
      - name: titulo
        label: Título
        type: string
        required: true
      - name: resumo
        label: Resumo
        type: text
        required: true
        description: 'Até 400 caracteres: o que o aluno vai fazer e o que leva da mentoria. Aparece no topo da página e no menu; a prévia do link no WhatsApp e no LinkedIn mostra só o começo, então comece pelo mais importante.'
        options:
          maxlength: 400
      - name: body
        label: Objetivo
        type: rich-text
        required: true
        description: 'O que o aluno vai aprender e entregar. Aparece no bloco "Objetivo" da página da mentoria.'
        options:
          media: mentorias
      - name: necessidade
        label: Necessidade de mercado atendida
        type: text
        description: 'Opcional. Por que esta mentoria importa para o mercado de trabalho (o contexto e a demanda das empresas). Aparece na página, junto ao objetivo.'
      - name: inscricoes
        label: Inscrições
        type: object
        fields:
          - name: abertura
            label: Abertura
            type: date
            required: true
            default: ""
            description: 'Primeiro dia em que as inscrições ficam abertas.'
          - name: fechamento
            label: Último dia de inscrição
            type: date
            required: true
            default: ""
            description: "Último dia em que o aluno pode se inscrever (não o dia em que o formulário fecha). Agende o fechamento do Google Forms para as 02:00 do dia seguinte. Ex.: inscrições até 10/10 → Forms fecha em 11/10 às 02:00."
      - name: realizacao
        label: Realização
        type: object
        fields:
          - name: inicio
            label: Início
            type: date
            required: true
            default: ""
            description: 'Primeiro dia de aula. Não pode ser antes do último dia de inscrição.'
          - name: fim
            label: Fim
            type: date
            required: true
            default: ""
            description: 'Último dia da mentoria. Depois dele, ela vai para a seção de encerradas.'
      - name: cursos
        label: Cursos elegíveis
        type: reference
        description: 'Selecione os cursos que podem participar. Se todos podem, escolha só "TODOS · Todos os cursos do Cluster de TI" (o primeiro da lista). Se o curso não aparece, cadastre-o antes em Cursos.'
        options:
          collection: cursos
          multiple: true
          value: "{name}"
          label: "{sigla} · {nome}"
          search: nome
      - name: prerequisitos
        label: Pré-requisitos
        type: string
        list: true
        description: 'Opcional. Um por item.'
      - name: eixos
        label: Eixos
        type: reference
        required: true
        options:
          collection: eixos
          multiple: true
          value: "{name}"
          label: "{numero}. {titulo}"
          search: titulo
      - name: mentores
        label: Mentores
        type: reference
        required: true
        description: 'Se o mentor não aparece na lista, cadastre-o antes em Mentores.'
        options:
          collection: mentores
          multiple: true
          value: "{name}"
          label: "{nome}"
          search: nome
      - name: selos
        label: Selos
        type: reference
        description: 'Opcional. Aparecem no card abaixo do status (ex.: Exclusiva para mulheres). Cadastre novos em Selos.'
        options:
          collection: selos
          multiple: true
          value: "{name}"
          label: "{nome}"
          search: nome
      - name: formUrl
        label: Link do Google Forms
        type: string
        required: true
        description: 'Link de inscrição (começa com https://). O botão "Inscrever-se" só aparece enquanto as inscrições estão abertas.'
        pattern:
          regex: '^https://\S+$'
          message: Cole o link completo, começando com https://
      - name: classroomCourseId
        label: ID da turma no Classroom
        type: string
        description: "Opcional. Abra a turma no Classroom e cole aqui o endereço da barra do navegador (https://classroom.google.com/c/...); o site converte para o ID numérico. Também aceita o número. Não use o código de convite."
        pattern:
          regex: '^(\d+|https://classroom\.google\.com/\S+)?$'
          message: Cole o link da turma (https://classroom.google.com/c/...) ou o ID numérico.
      - name: destaque
        label: Destaque no menu
        type: boolean
        description: 'Mostra esta mentoria no bloco grande do menu Mentorias. Marque só uma; se houver mais de uma, vale a que aparece primeiro na home. Encerradas não aparecem.'
      - name: capa
        label: Imagem de capa
        type: image
        description: 'Opcional. Qualquer tamanho; o site redimensiona e otimiza.'
        options:
          media: mentorias
      - name: parceiro
        label: Empresa parceira
        type: object
        description: 'Só para mentorias em parceria. Nome, logo e site: preencha os três ou deixe os três vazios. A logo para o tema escuro e a autorização são opcionais.'
        fields:
          - name: nome
            label: Nome da empresa
            type: string
          - name: logo
            label: Logo (tema claro)
            type: image
            description: 'SVG ou PNG com fundo transparente, de preferência. Versão para fundo claro; sem a logo do tema escuro, aparece nos dois temas.'
            options:
              media: parceiros
          - name: logoEscura
            label: Logo para o tema escuro (opcional)
            type: image
            description: 'Versão clara da logo (ex.: branca), para fundo escuro, o tema padrão do site. Use quando a logo normal some no escuro.'
            options:
              media: parceiros
          - name: url
            label: Site
            type: string
            pattern:
              regex: '^(https://\S+)?$'
              message: Cole o link completo, começando com https://
          - name: exibirEmParcerias
            label: A empresa autorizou aparecer na página Parcerias
            type: boolean
            description: 'Marque só com a autorização da empresa (por escrito, por e-mail). Basta marcar em uma mentoria da empresa; para retirar, desmarque em todas.'
      - name: resultado
        label: Resultado da turma
        type: object
        description: 'Tudo opcional. Inscritos: depois que as inscrições fecharem. Concluintes, avaliação e depoimentos: ao fim da mentoria. Aparece na página só a partir do início da turma e define os destaques entre as encerradas.'
        fields:
          - name: inscritos
            label: Inscritos
            type: number
            description: 'Total de inscrições válidas (sem respostas duplicadas no Forms).'
            options:
              min: 0
              step: 1
          - name: concluintes
            label: Concluintes
            type: number
            description: 'Quem concluiu a mentoria. Não pode passar do número de inscritos.'
            options:
              min: 0
              step: 1
          - name: avaliacao
            label: Avaliação dos alunos
            type: object
            description: 'Do formulário de feedback, nota de 1 a 5. Preencha os dois campos ou nenhum. O site só mostra a média com 5 respostas ou mais.'
            fields:
              - name: media
                label: Nota média (1 a 5)
                type: number
                description: 'Com uma casa decimal, ex.: 4.7'
                options:
                  min: 1
                  max: 5
                  step: 0.1
              - name: respostas
                label: Número de respostas
                type: number
                options:
                  min: 1
                  step: 1
          - name: depoimentos
            label: Depoimentos
            type: object
            list: true
            description: 'Só com autorização do aluno por escrito (ex.: pergunta de consentimento no formulário de feedback). O primeiro aparece no destaque da galeria de encerradas.'
            fields:
              - name: texto
                label: Depoimento
                type: text
                description: 'Até 280 caracteres, nas palavras do aluno (corrija só erros de digitação).'
                options:
                  maxlength: 280
              - name: autor
                label: Como assinar
                type: string
                description: 'Como o aluno autorizou aparecer, ex.: Ana S., ADS. Sem sobrenome completo, e-mail ou foto.'
              - name: autorizado
                label: O aluno autorizou a publicação
                type: boolean
                description: 'Obrigatório. Sem esta marcação, o site não é atualizado.'

  - name: mentores
    label: Mentores
    description: 'Renomeie o arquivo só antes de usar em mentorias; depois disso, selecione de novo nas mentorias que o usam, senão o site não é atualizado.'
    type: collection
    path: src/content/mentores
    format: yaml
    filename: "{nome}.yaml"
    view:
      primary: nome
      fields: [nome, cargo, empresa]
      sort: [nome]
      search: [nome, empresa]
      default:
        sort: nome
        order: asc
    fields:
      - name: nome
        label: Nome
        type: string
        required: true
        description: 'Nome como deve aparecer no site, sem título (Prof., Profa.). Define o nome do arquivo na criação; corrigir o nome depois não muda o arquivo.'
      - name: tipo
        label: Tipo de mentor
        type: select
        required: true
        default: convidado
        description: 'Fixo: professor que mantém o programa. Convidado: profissional ou professor que conduz mentorias específicas. Separa os mentores em duas seções na página Mentores.'
        options:
          values:
            - value: fixo
              label: Fixo (equipe do programa)
            - value: convidado
              label: Convidado
      - name: foto
        label: Foto
        type: image
        description: 'Opcional. Foto de rosto, de preferência quadrada; qualquer tamanho, o site otimiza. Sem foto, aparece um ícone de pessoa.'
        options:
          media: mentores
      - name: cargo
        label: Cargo
        type: string
        required: true
        description: 'Função profissional, sem a empresa (ela tem campo próprio). Ex.: Professora de Banco de Dados, Desenvolvedor Back-end Sênior.'
      - name: empresa
        label: Empresa
        type: string
        description: 'Opcional.'
      - name: bio
        label: Bio curta
        type: text
        required: true
        description: 'Até 500 caracteres: quem é e em que pode ajudar o aluno. O currículo completo fica no LinkedIn.'
        options:
          maxlength: 500
      - name: linkedin
        label: LinkedIn
        type: string
        description: 'Opcional. Link completo do perfil, começando com https://'
        pattern:
          regex: '^(https://\S+)?$'
          message: Cole o link completo, começando com https://
      - name: github
        label: GitHub
        type: string
        description: 'Opcional. Link completo do perfil, começando com https://'
        pattern:
          regex: '^(https://\S+)?$'
          message: Cole o link completo, começando com https://
      - name: youtube
        label: YouTube
        type: string
        description: 'Opcional. Link do canal, começando com https://'
        pattern:
          regex: '^(https://\S+)?$'
          message: Cole o link completo, começando com https://
      - name: medium
        label: Medium
        type: string
        description: 'Opcional. Link do perfil, começando com https://'
        pattern:
          regex: '^(https://\S+)?$'
          message: Cole o link completo, começando com https://
      - name: instagram
        label: Instagram
        type: string
        description: 'Opcional. Link do perfil, começando com https://'
        pattern:
          regex: '^(https://\S+)?$'
          message: Cole o link completo, começando com https://
      - name: lattes
        label: Currículo Lattes
        type: string
        description: 'Opcional. Link do currículo, começando com https:// (ex.: https://lattes.cnpq.br/…)'
        pattern:
          regex: '^(https://\S+)?$'
          message: Cole o link completo, começando com https://
      - name: site
        label: Site pessoal ou portfólio
        type: string
        description: 'Opcional. Link completo, começando com https://'
        pattern:
          regex: '^(https://\S+)?$'
          message: Cole o link completo, começando com https://

  - name: eixos
    label: Eixos
    description: 'Renomeie o arquivo só antes de usar em mentorias; depois disso, selecione de novo nas mentorias que o usam, senão o site não é atualizado.'
    type: collection
    path: src/content/eixos
    format: yaml
    # O número na frente do arquivo ordena a lista do painel (1-curriculo-e-trabalhabilidade.yaml);
    # o endereço da página do eixo fica sem ele (/eixos/curriculo-e-trabalhabilidade/).
    filename: "{numero}-{titulo}.yaml"
    view:
      primary: titulo
      fields: [numero, titulo]
      sort: [ordem, numero]
      default:
        sort: ordem
        order: asc
    fields:
      - name: numero
        label: Número
        type: number
        required: true
        description: 'Número do eixo (1, 2, 3...).'
        options:
          min: 1
          step: 1
      - name: titulo
        label: Título
        type: string
        required: true
        description: 'Sem o prefixo "Mentoria de".'
      - name: descricao
        label: Descrição
        type: text
        required: true
        description: 'Uma ou duas frases.'
      - name: ordem
        label: Ordem de exibição
        type: number
        required: true
        description: 'Posição na lista do site (1 = primeiro). Normalmente igual ao número.'
        options:
          step: 1
      - name: icone
        label: Ícone
        type: select
        required: true
        description: 'Aparece no canto dos cards das mentorias deste eixo. Para um ícone novo, peça ao mantenedor.'
        options:
          values:
            - value: maleta
              label: Maleta (currículo, trabalho)
            - value: codigo
              label: Código </> (prática)
            - value: livro
              label: Livro aberto (conteúdo técnico)
            - value: ferramenta
              label: Chave inglesa
            - value: capelo
              label: Capelo de formatura (vida acadêmica)
            - value: grafico
              label: Gráfico subindo (carreira)
      # Conteúdo da página do eixo (/eixos/<eixo>/). Tudo opcional: cada seção só aparece se preenchida.
      - name: capa
        label: Capa (banner)
        type: image
        description: 'Opcional. Foto larga no topo da página do eixo (recortada em faixa 4:1). Sem capa, o site usa o degradê da marca com o ícone do eixo.'
        options:
          media: eixos
      - name: capaPosicao
        label: Posição vertical da capa
        type: number
        description: 'Qual parte da foto aparece na faixa: 0 = topo, 50 = meio, 100 = base. Padrão: 50.'
        options:
          min: 0
          max: 100
          step: 5
      - name: ilustracao
        label: Imagem do cenário prático
        type: image
        description: 'Opcional. Aparece ao lado do cenário prático (recortada em 4:3). Sem imagem, o degradê da marca com o ícone.'
        options:
          media: eixos
      - name: objetivo
        label: Objetivo
        type: text
        description: 'Uma frase, no topo da página do eixo.'
      - name: apresentacao
        label: Apresentação
        type: object
        description: 'Texto de abertura da página. Introdução obrigatória se houver itens ou fechamento. Para separar parágrafos, deixe uma linha em branco.'
        fields:
          - name: introducao
            label: Introdução
            type: text
          - name: itens
            label: Lista (opcional)
            type: string
            list: true
          - name: fechamento
            label: Texto depois da lista (opcional)
            type: text
      - name: competencias
        label: Competências que serão desenvolvidas
        type: object
        list: true
        description: 'Um grupo por tipo (ex.: Técnicas, Profissionais, Comportamentais), lado a lado na página. Cada grupo precisa de ao menos um item.'
        fields:
          - name: titulo
            label: Tipo
            type: string
          - name: itens
            label: Competências
            type: string
            list: true
      - name: cenario
        label: Cenário prático
        type: object
        description: 'O caso que a mentoria trabalha ("Imagine um estudante que..."): introdução, dificuldades em lista e o fechamento, que aparece em destaque.'
        fields:
          - name: introducao
            label: Introdução
            type: text
          - name: itens
            label: Dificuldades
            type: string
            list: true
          - name: fechamento
            label: Fechamento
            type: text
      - name: aprendizagem
        label: Aprendizagem
        type: object
        description: 'A página escreve "Durante a mentoria, o estudante aprende a:" antes da lista; comece cada item com um verbo (Analisar, Planejar...).'
        fields:
          - name: itens
            label: O que o estudante aprende
            type: string
            list: true
          - name: fechamento
            label: Ao final (opcional)
            type: text
      - name: publico
        label: Público-alvo
        type: object
        description: 'Um ou mais grupos (ex.: "Estudantes ingressantes que:") com os itens, e uma observação opcional no fim.'
        fields:
          - name: grupos
            label: Grupos
            type: object
            list: true
            fields:
              - name: titulo
                label: Quem
                type: string
              - name: itens
                label: Itens
                type: string
                list: true
          - name: observacao
            label: Observação (opcional)
            type: text
      - name: perfil
        label: Perfil do estudante
        type: string
        list: true
        description: 'Características de quem aproveita mais este eixo (ex.: "Tem dificuldade em...").'

  - name: cursos
    label: Cursos
    description: 'Cursos do Cluster de TI, selecionados nas mentorias. "Todos os cursos do Cluster de TI" é a opção que vale por todos: não exclua nem renomeie. Antes de excluir ou renomear um curso já usado, retire-o das mentorias que o usam.'
    type: collection
    path: src/content/cursos
    format: yaml
    filename: "{nome}.yaml"
    view:
      primary: nome
      fields: [sigla, nome]
      sort: [nome]
      default:
        sort: nome
        order: asc
    fields:
      - name: nome
        label: Nome do curso
        type: string
        required: true
        description: 'Nome completo, ex.: Análise e Desenvolvimento de Sistemas.'
      - name: sigla
        label: Sigla
        type: string
        required: true
        description: 'Ex.: ADSIS. Aparece ao lado do nome na página da mentoria.'

  - name: selos
    label: Selos
    description: 'Rótulos livres exibidos nos cards. Antes de excluir ou renomear um selo já usado, retire-o das mentorias que o usam.'
    type: collection
    path: src/content/selos
    format: yaml
    filename: "{nome}.yaml"
    exclude: [README.md]
    view:
      primary: nome
      fields: [nome]
    fields:
      - name: nome
        label: Nome
        type: string
        required: true
        description: "Texto curto, ex.: Exclusiva para mulheres, Em parceria, Vagas limitadas. A cor é a mesma para todos os selos."

settings:
  # Esconde o editor de configuração do painel: o .pages.yml só muda por commit.
  config: false
  commit:
    # Na prática, o painel grava com o usuário logado como autor (e-mail noreply do GitHub) e dispara o deploy.
    # Não use {user}/{userEmail} nas mensagens: viram o e-mail da conta, público no histórico (seção 10).
    identity: app
    templates:
      create: "conteúdo: cria {path} (painel)"
      update: "conteúdo: atualiza {path} (painel)"
      delete: "conteúdo: remove {path} (painel)"
      rename: "conteúdo: renomeia {oldPath} para {newPath} (painel)"
