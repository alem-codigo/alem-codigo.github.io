name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # 05:00 UTC = 02:00 em São Paulo, junto com o fechamento dos formulários (D-14).
    # O agendador do GitHub pode atrasar alguns minutos.
    - cron: '0 5 * * *'

# Nenhuma permissão por padrão; cada job declara o que precisa.
permissions: {}

concurrency:
  group: deploy-${{ github.ref }}
  # Em PR, um push novo cancela a verificação anterior; no main, deploys nunca são interrompidos.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Passos escritos diretamente (sem withastro/action): a action composta referencia
# setup-bun e setup-deno, que a allowlist da organização bloqueia mesmo sem executá-los.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # O status das mentorias é calculado com o "hoje" de São Paulo (seção 6.3).
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Versão do pnpm lida de `packageManager` no package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Cache das imagens otimizadas pelo Astro entre builds.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.astro
          key: astro-${{ runner.os }}-${{ github.sha }}
          restore-keys: astro-${{ runner.os }}-

      - run: pnpm test

      # astro check + build; conteúdo inválido não chega à produção.
      - run: pnpm build

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  deploy:
    # PRs (inclusive do Dependabot) só validam o build.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
