bio: Mestranda em Ensino de Ciências Humanas, Sociais e da Natureza pela UTFPR,
  graduada em Análise e Desenvolvimento de Sistemas, Administração e Pedagogia.
  Professora no ensino superior, com atuação nas áreas de Tecnologia da
  Informação, Gestão de Projetos, Governança de TI, Inteligência Artificial e
  Finanças. Possui experiência na área de gestão de projetos e mais de 17 anos
  de experiência em Administração, com ênfase em Administração Financeira,
  Agronegócios, Cooperativismo e Comércio Exterior. É autora de cinco livros nas
  áreas de Administração Financeira e Comércio Exterior, incluindo Fluxo de
  Caixa e Administração de Capital de Giro, Gestão de Operações de Câmbio e
  Financiamento no Comércio Exterior, Gestão de Operações de Exportação,
  Operações Logísticas Internacionais e Títulos de Renda Fixa.
